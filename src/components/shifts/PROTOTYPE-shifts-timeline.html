}
function linesC(row, x, v) {
  var it = x.item, vis = x.vis, key = row.id + ':' + (it.vipKey || it.kind), out = [], nm = it.vipKey ? '<span class="who">' + vname(it.vipKey) + '</span>' : '';
  var hi = it.priority === 'high' ? ' hi' : '', S_ = function (t, h) { out.push('<div class="c-s' + (h ? ' hi' : '') + '">' + t + '</div>'); };
  if (it.kind === 'cash-line') { S_('The cash line moved <span class="amber">' + lineMove(it) + '</span> <span class="ln">(' + fmtPts(it.points.to) + ', ' + fmtRank(it.rank.to) + ')</span>'); return out; }

  if (vis.indexOf('rankpoints') >= 0) { var dr = it.rank.to - it.rank.from, dp = r2(it.points.to - it.points.from); S_(nm + ' ' + (dr < 0 ? '<span class="up">up ' + Math.abs(dr) + '</span>' : '<span class="dn">down ' + Math.abs(dr) + '</span>') + ' to ' + fmtRank(it.rank.to) + ', ' + fmtSig(dp) + ' pts <span class="ln">(' + fmtSig(it.distanceToCashPoints.to) + ' to cash)</span>'); }
  if (vis.indexOf('player') >= 0) playerEvents(it).forEach(function (e) { S_(nm + ': ' + (e.type === 'reveal' ? '<span class="amber">revealed</span> ' + e.name + ' ' + fmtSig(e.pts) : e.name + ' <span class="amber">final</span> at ' + fmtPts(e.pts))); });
  if (x.hidden) out.push('<div class="c-s"><button class="c-tg" type="button" data-act="showall" data-id="' + it.id + '">…' + x.hidden + ' filtered out, show</button></div>');
  if (it.lineup && (vis.indexOf('rankpoints') >= 0 || vis.indexOf('player') >= 0)) {
    var lu = lineupHTML(it, key);
    out.push('<div class="c-s"><button class="c-tg" type="button" data-act="lu" data-id="' + key + '" aria-expanded="' + !!S.open[key] + '">lineup ' + lu.changed + '/' + lu.total + ' ' + (S.open[key] ? '▾' : '▸') + '</button></div>');
    if (S.open[key]) out.push('<div class="c-lu">' + it.lineup.map(function (s) { var ch = (s.pointsMove || 0) !== 0 || s.locked.from !== s.locked.to; return '<div class="' + (ch ? '' : 'still') + '"><span>' + (s.locked.to ? 'locked' : s.name) + '</span><span class="' + (s.pointsMove > 0 ? 'up' : s.pointsMove < 0 ? 'dn' : 'mut') + '">' + (s.locked.to ? '' : s.pointsMove === 0 ? '0.00' : fmtSig(s.pointsMove)) + '</span></div>'; }).join('') + '</div>');
  }

}
function listC(v) {

    if (v.divAt === i) h += '<div class="c-div" role="separator">seen mark ' + hm(v.seen) + (i === 0 ? ' · caught up' : '') + '</div>';
    if (row.kind === 'gap') { var g = gapText(row); h += '<div class="c-gap"><span>' + hm(row.t) + ' ' + g[0].toLowerCase() + '. ' + g[1] + '</span>' + (row.reason === 'unavailable' ? '<button class="c-tg" type="button" data-act="retry" data-id="' + row.id + '">' + (S.retrying[row.id] === 1 ? 'retrying…' : S.retrying[row.id] === 2 ? 'still unavailable' : 'retry') + '</button>' : '') + '</div>'; return; }

  });

}
function footC(v) {

  if (v.more) return '<div class="c-foot"><button class="ld" type="button" data-act="more">▸ load 10 more</button><span>back to ~' + hm(nextBackT(v)) + ' · ' + v.snaps + '/' + CAP + ' snapshots loaded</span></div>';
  var r = reasonText(v); return '<div class="c-rule">── ' + r[0].toLowerCase() + ' ──<br>' + r[1] + '</div>';
}
function viewC(v) {
  var tabs = '<div class="c-tabs" role="tablist"><button role="tab" type="button" data-act="tab" data-k="summary" aria-selected="' + (S.tab === 'summary') + '">since-you-looked(' + summaryCount() + ')</button><button role="tab" type="button" data-act="tab" data-k="timeline" aria-selected="' + (S.tab === 'timeline') + '">timeline</button><span class="sp"></span><button type="button" data-act="seen" ' + (summaryCount() ? '' : 'disabled') + '>mark-as-seen</button></div>';
  var title = '<div class="pagehead"><h1>Shifts</h1><span class="status">' + CONTEST + '</span></div>';
  if (S.tab === 'summary') return title + tabs + summaryHTML();
  var body;
  if (S.scenario === 'loading') { var p = loadingFirst(); body = '<div class="c-foot" role="status"><span class="c-bar">[' + '█'.repeat(10) + '░'.repeat(10) + ']</span><span>loading the newest 6 snapshots ' + p.done + '/' + p.total + '</span></div>' + skeleton(2); }
  else if (!v.seq.length) body = emptyBlock(v, 'c');
  else body = '<div class="c-rule" style="text-align:left;margin:0">' + v.shown + ' of ' + v.stepsLoaded + ' entries · newest first · ' + hm(v.newestT) + ' → ' + hm(v.oldestT || WINDOW_START) + '</div>' + listC(v) + footC(v);
  return title + tabs + (S.scenario === 'loading' ? '' : qC()) + body;
}

/* ====================== Render + actions ====================== */
var $ = function (id) { return document.getElementById(id); };
function seg(el, items, cur, act) { el.innerHTML = items.map(function (i) { return '<button type="button" data-set="' + act + '" data-v="' + i[0] + '" aria-pressed="' + (cur === i[0]) + '">' + i[1] + '</button>'; }).join(''); }
function render() {
  var keepY = window.scrollY, v = compute(), strips = [].map.call(document.querySelectorAll('[data-strip]'), function (e) { return e.scrollLeft; });
  var fn = S.variant === 'A' ? viewA : S.variant === 'B' ? viewB : viewC;
  $('view').innerHTML = fn(v);
  [].forEach.call(document.querySelectorAll('[data-strip]'), function (e, i) { e.scrollLeft = strips[i] || 0; });
  seg($('seg-scn'), SCN, S.scenario, 'scn'); seg($('seg-end'), END, S.endReason, 'end'); seg($('seg-seen'), SEEN, S.seenT !== null ? '' : S.seenMode, 'seen');
  $('row-end').hidden = S.scenario !== 'end';
  var cur = VARS.filter(function (x) { return x.k === S.variant; })[0];
  $('vlabel').textContent = cur.k + ' (' + cur.n + ')';
  $('status').textContent = 'variant ' + cur.k + ' · ' + S.scenario + ' · ' + v.shown + ' of ' + v.stepsLoaded + ' loaded entries shown · ' + v.snaps + '/' + CAP + ' snapshots';
  var f = S.filters;
  $('state').textContent = JSON.stringify({
    variant: S.variant + ' (' + cur.n + ')', scenario: S.scenario, tab: S.tab, entriesLoaded: v.stepsLoaded, entriesShown: v.shown, hiddenByFilters: v.hiddenSteps, gaps: v.gapsLoaded,
    snapshotsLoaded: v.snaps + '/' + CAP, range: (v.oldestT ? hm(v.oldestT) : '-') + ' -> ' + (v.newestT ? hm(v.newestT) : '-'),
    loadMore: S.loadingMore ? 'loading ' + S.loadingMore.done + '/' + S.loadingMore.total : v.more ? 'available' : 'ended: ' + v.reason,
    seenMark: v.seen === null ? 'none' : hm(v.seen), divider: v.seen === null ? 'none' : v.outside ? 'outside loaded range (note shown)' : v.caughtUp ? 'top (caught up)' : v.divAt === null ? 'none' : 'before entry ' + (v.divAt + 1),
    filters: { vips: f.vips, kinds: f.kinds, highOnly: f.high }, newEntriesInjected: S.injected.length
  }, null, 1);
  window.scrollTo(0, keepY);
}
function clear() { timers.forEach(clearInterval); timers = []; S.loadingMore = null; }
function setScenario(s) { clear(); S.scenario = s; S.loaded = 5; S.injected = []; S.seenT = null; S.open = {}; S.showAll = {}; S.retrying = {}; S.freshId = null; S.tab = 'timeline';
  S.filters.vips = s === 'single' ? ['you'] : PROFILE.slice(); if (s === 'end') S.loaded = 99; }
function inject() {
  if (S.scenario === 'empty' || S.scenario === 'loading') { setScenario('full'); }
  var rows = allRows(), t = (rows.length ? rows[0].t : T(21, 30)) + 5, fn = INJECT[S.injected.length % INJECT.length], row = fn(t);
  if (S.scenario === 'single') row = ST_(row, function (it) { return it.kind !== 'vip' || it.vipKey === 'you'; }) || ST(t, [CL([312.5, 314.1], [4206, 4239])]);
  if (S.scenario === 'completed') row = ST(t, [CL([379.6, 380.2], [4010, 4033])]);
  row.live = true; row.id = row.id + 'n' + S.injected.length; row.items.forEach(function (it) { it.id = row.id + ':' + (it.vipKey || it.kind); });
  S.injected.unshift(row); S.freshId = row.id; render();
  setTimeout(function () { if (S.freshId === row.id) { S.freshId = null; render(); } }, 3000);
  var el = $('status'); el.textContent = 'new entry arrived at ' + hm(t) + ' (top of the Timeline)';
}
function loadMore() {
  if (S.loadingMore) return; S.loadingMore = { done: 0, total: 10 }; render();
  var id = setInterval(function () { S.loadingMore.done++; if (S.loadingMore.done >= S.loadingMore.total) { clearInterval(id); S.loadingMore = null; S.loaded += 10; } render(); }, 170);
  timers.push(id);
}
function toggle(arr, k) { var i = arr.indexOf(k); if (i >= 0) arr.splice(i, 1); else arr.push(k); }
document.addEventListener('click', function (e) {
  var s = e.target.closest('[data-set]');
  if (s) { var a = s.dataset.set, val = s.dataset.v;
    if (a === 'scn') setScenario(val); else if (a === 'end') { S.endReason = val; } else if (a === 'seen') { S.seenMode = val; S.seenT = null; }
    render(); return; }
  var b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT') return;
  var act = b.dataset.act, k = b.dataset.k, id = b.dataset.id, f = S.filters;
  if (act === 'tab') S.tab = k; else if (act === 'vip') toggle(f.vips, k); else if (act === 'kind') toggle(f.kinds, k); else if (act === 'high') f.high = !f.high;
  else if (act === 'vipprofile') f.vips = S.scenario === 'single' ? ['you'] : PROFILE.slice();
  else if (act === 'fopen') S.fopen = !S.fopen; else if (act === 'lu') S.open[id] = !S.open[id]; else if (act === 'showall') S.showAll[id] = true;
  else if (act === 'resetf') { f.vips = S.scenario === 'single' ? ['you'] : PROFILE.slice(); f.kinds = KINDS.map(function (x) { return x[0]; }); f.high = false; }
  else if (act === 'more') return loadMore();
  else if (act === 'seen') { var r = allRows(); S.seenT = r.length ? r[0].t + 1 : null; S.tab = 'summary'; }
  else if (act === 'retry') { S.retrying[id] = 1; render(); setTimeout(function () { S.retrying[id] = 2; render(); }, 900); return; }
  render();
});
document.addEventListener('change', function (e) { var b = e.target; if (b.tagName !== 'INPUT') return; var f = S.filters, act = b.dataset.act, k = b.dataset.k; if (act === 'vip') toggle(f.vips, k); else if (act === 'kind') toggle(f.kinds, k); else if (act === 'high') f.high = !f.high; render(); });
function setVariant(k, from) { S.variant = k; try { var u = new URL(location.href); u.searchParams.set('variant', k); u.hash = 'variant-' + k.toLowerCase(); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch (err) { try { location.hash = 'variant-' + k.toLowerCase(); } catch (e2) { } } render(); }
function cycle(d) { var i = VARS.map(function (x) { return x.k; }).indexOf(S.variant); setVariant(VARS[(i + d + VARS.length) % VARS.length].k); }
$('prev').onclick = function () { cycle(-1); }; $('next').onclick = function () { cycle(1); };
$('btn-new').onclick = inject; $('bar-new').onclick = inject;
document.addEventListener('keydown', function (e) { var t = e.target; if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return; if (e.key === 'ArrowLeft') cycle(-1); else if (e.key === 'ArrowRight') cycle(1); });
(function init() {
  var q = ''; try { q = new URLSearchParams(location.search).get('variant') || ''; } catch (e) { }
  var h = (location.hash || '').replace('#', ''), m = /variant-?([abc])/i.exec(h) || /^([abc])$/i.exec(q);
  if (!m && /^[abc]$/i.test(q)) m = [0, q];

})();
