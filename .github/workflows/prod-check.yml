name: Prod Check

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Snapshot key (snapshots/live-<timestamp>.json), or latest'
        default: latest
      sports:
        description: 'Space-separated sports to check, or all'
        default: all
      expect_commit:
        description: 'Full SHA of the producer commit the snapshot must be built from (or a later one), or empty'
        default: ''
      pr:
        description: 'PR number to check with its own code and comment the report on, or empty'
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  prod-check:
    name: Prod check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate the PR number
        if: ${{ inputs.pr != '' }}
        env:
          PR: ${{ inputs.pr }}
        run: |
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "pr must be a pull request number, got '$PR'" >&2
            exit 1
          fi

      # With `pr`, the run uses that PR's head, so the report reflects the branch's code, not the default branch's.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr != '' && format('refs/pull/{0}/head', inputs.pr) || '' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The check logic lives in `npm run prod:check`; this step only publishes its report and passes on its exit code.
      # The script also sets this step's `outcome` and `snapshot` outputs, for later steps to branch on.
      - name: Run the prod check
        id: check
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SNAPSHOT: ${{ inputs.snapshot }}
          SPORTS: ${{ inputs.sports }}
          EXPECT_COMMIT: ${{ inputs.expect_commit }}
        run: |
          set +e
          # Word splitting is intended: SPORTS holds several sports.
          # shellcheck disable=SC2086
          # The flag is passed only when asked for, so a `pr` run on a branch that predates it still works.
          expect=()
          if [ -n "$EXPECT_COMMIT" ]; then expect=(--expect-commit "$EXPECT_COMMIT"); fi
          npm run --silent prod:check -- $SPORTS "$SNAPSHOT" "${expect[@]}" > report.txt 2> errors.txt
          status=$?
          { echo '```text'; cat report.txt errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat report.txt
          cat errors.txt >&2
          exit "$status"

      # The comment holds the compact report only, which never prints the raw snapshot. It is posted on a pass and on a
      # failure alike, so the PR shows the verdict either way.
      - name: Comment the report on the PR
        if: ${{ always() && inputs.pr != '' && steps.check.conclusion != 'skipped' && steps.check.conclusion != 'cancelled' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Prod check for this PR's head ([run]($RUN_URL))."
            echo
            echo '```text'
            cat report.txt errors.txt
            echo '```'
          } > comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md

      # Only the outcome decides: `dashboard` (an invariant failed, or an unread path isn't allowlisted) captures the
      # checked snapshot as a prod fixture and opens a draft PR with the report. `pass`, or a setup error that set no
      # outcome, opens nothing. A run with `pr` only comments: its checkout is the PR's code, not a base to branch from.
      # The PR is red by design: the operator fixes the dashboard on it, or closes it if the cause is a producer bug.
      # Prod snapshots age out of R2 after 30 days; this is how a failing case survives.
      - name: Capture the failing snapshot as a prod fixture
        if: ${{ always() && inputs.pr == '' && steps.check.outputs.outcome == 'dashboard' }}
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SNAPSHOT_KEY: ${{ steps.check.outputs.snapshot }}
          # The branch the run was dispatched from: normally the default branch, or a scratch branch for a trial run.
          BASE_BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          npm run --silent fixture:refresh -- "$SNAPSHOT_KEY"
          name=$(basename "$SNAPSHOT_KEY" .json)
          branch="prod-fixture/$name"
          title="test(contract): capture $name as a prod fixture"
          {
            echo "The [Prod Check run]($RUN_URL) failed the Live contract on \`$SNAPSHOT_KEY\`. This draft adds the trimmed"
            echo "snapshot to \`contract/prod-fixtures/\`, so the contract suite fails on it until the dashboard is fixed."
            echo
            echo "Fix the dashboard on this branch, or close the PR if the report shows a producer bug."
            echo "Record the producer commit in \`public/mock/PRODUCER_FIXTURE.md\`."
            echo
            echo '```text'
            cat report.txt errors.txt
            echo '```'
          } > body.md
          # A re-run on a snapshot that is already captured never overwrites the operator's work on the draft.
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists; leaving that draft as it is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add contract/prod-fixtures
          if git diff --cached --quiet; then
            echo "$SNAPSHOT_KEY is already a prod fixture on $BASE_BRANCH; nothing to capture."
            exit 0
          fi
          git commit -m "$title"
          git push origin "$branch"
          gh pr create --draft --base "$BASE_BRANCH" --head "$branch" --title "$title" --body-file body.md
