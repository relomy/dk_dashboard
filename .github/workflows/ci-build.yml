name: CI Build

on:
  pull_request:
  push:
    branches:
      - main
  # The producer bump workflow dispatches this on its branch: a PR opened with GITHUB_TOKEN does not
  # trigger pull_request workflows.
  workflow_dispatch:

jobs:
  build:
    name: npm ci + npm run check:functions + npm run build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Functions type-check
        run: npm run check:functions

      - name: Build
        run: npm run build

  lint-test:
    name: npm ci + npm run lint + npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The token budget step diffs against the PR's base commit.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The pre-commit hook's check, run on the PR's changed files so --no-verify can't skip it.
      - name: Token budget
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff -z --name-only --diff-filter=d "$BASE_SHA...HEAD" | xargs -0 -r sh scripts/check-token-budget.sh

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test
