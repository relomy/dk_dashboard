name: CI Build

on:
  pull_request:
  push:
    branches:
      - main
  # The producer bump workflow dispatches this on its branch: a PR opened with GITHUB_TOKEN does not
  # trigger pull_request workflows.
  workflow_dispatch:

jobs:
  build:
    name: npm ci + npm run check:functions + npm run build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Functions type-check
        run: npm run check:functions

      - name: Build
        run: npm run build

  lint-test:
    name: npm ci + npm run lint + npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The pre-commit hook's check, run on every tracked file (not just the PR's changed ones) so
      # --no-verify can't skip it.
      - name: Token budget
        run: git ls-files -z | xargs -0 sh scripts/check-token-budget.sh

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  pure-move:
    name: npm run check:pure-move
    # A token-budget split (#142) must be a pure move; those PRs say "under token budget" in their title.
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'under token budget')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The check reads the PR's base commit.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pure move
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run check:pure-move -- "$BASE_SHA"
